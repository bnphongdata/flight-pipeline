# ==============================================================================
# CẤU HÌNH DỰ ÁN DBT (DBT PROJECT CONFIGURATION)
# ==============================================================================

name: 'flights'
version: '1.0.0'
config-version: 2

# Profile kết nối tương ứng trong profiles.yml
profile: 'flights'

# Các đường dẫn thư mục tài nguyên trong dbt
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Thư mục chứa kết quả build/compile
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Cấu hình Materialization cho các models
models:
  flights:
    # Tầng curated được materialize dạng bảng (table)
    curated:
      +materialized: table
    # Tầng staging_to_raw materialize dạng bảng (hoặc incremental được ghi đè trong model)
    staging_to_raw:
      +materialized: table
